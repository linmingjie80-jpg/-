<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>开单 · 富贵花开</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/kaidan.css">
</head>
<body>

  <!-- 登录 -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h1>🌸 <em>富贵花开</em> 开单</h1>
      <p>员工登录</p>
      <div class="field"><label>名字</label><input id="in-name" type="text" autocomplete="username" placeholder="你的名字"></div>
      <div class="field"><label>PIN 密码</label><input id="in-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="数字密码"></div>
      <button id="btn-login" class="btn-primary">登录</button>
      <div id="login-err" class="err"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <div class="topbar">
      <div><b>🌸 <em>开单</em></b><div class="who" id="who"></div></div>
      <button class="btn-logout" id="btn-logout">退出</button>
    </div>
    <div id="content" class="wrap"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/kaidan.js"></script>
</body>
</html>
