<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>开单 · 富贵花开</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/kaidan.css">
</head>
<body>

  <!-- ── 登录 ── -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h1>🌸 <em>富贵花开</em> 开单</h1>
      <p>员工登录</p>
      <div class="field">
        <label>名字</label>
        <input id="in-name" type="text" autocomplete="username" placeholder="你的名字">
      </div>
      <div class="field">
        <label>PIN 密码</label>
        <input id="in-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4 位数字">
      </div>
      <button id="btn-login" class="btn-primary">登录</button>
      <div id="login-err" class="err"></div>
    </div>
  </div>

  <!-- ── 主界面 ── -->
  <div id="app" class="hidden">
    <div class="topbar">
      <div>
        <b>🌸 <em>开单</em></b>
        <div class="who" id="who"></div>
      </div>
      <button class="btn-logout" id="btn-logout">退出</button>
    </div>

    <!-- 工人开单视图 -->
    <div id="view-order" class="wrap hidden">
      <div class="sec-title">① 选产品 · 填数量</div>
      <div id="prod-list" class="prod-list"></div>

      <div class="sec-title">② 客户信息</div>
      <div class="card">
        <div class="field"><label>客户名字</label><input id="c-name" type="text" placeholder="选填"></div>
        <div class="row2">
          <div class="field"><label>电话</label><input id="c-phone" type="tel" inputmode="numeric" placeholder="选填"></div>
        </div>
        <div class="field"><label>送货地址</label><textarea id="c-addr" rows="2" placeholder="选填"></textarea></div>
      </div>

      <div class="sec-title">③ 金额</div>
      <div class="card">
        <div class="amt-line"><span>小计</span><span class="v" id="a-sub">RM 0.00</span></div>
        <div class="amt-line"><span>折扣 (RM)</span><span class="adj"><input id="a-disc" type="number" inputmode="decimal" min="0" step="0.01" value="0"></span></div>
        <div class="amt-line"><span>运费 (RM)</span><span class="adj"><input id="a-ship" type="number" inputmode="decimal" min="0" step="0.01" value="0"></span></div>
        <div class="field" style="margin-top:8px"><label>备注</label><input id="a-note" type="text" placeholder="选填，例如：明天送"></div>
        <div class="amt-line total"><span>应收</span><span class="v" id="a-total">RM 0.00</span></div>
      </div>
    </div>

    <!-- 老板订单视图 -->
    <div id="view-boss" class="wrap hidden">
      <div class="sec-title">业绩概览（最近 300 单）</div>
      <div class="stats" id="stats"></div>
      <div class="sec-title">订单记录</div>
      <div id="ord-list"></div>
    </div>
  </div>

  <!-- 工人底部操作条 -->
  <div id="actionbar" class="actionbar hidden">
    <div class="total-mini"><small>应收</small><b id="bar-total">RM 0.00</b></div>
    <button class="btn-submit" id="btn-submit"><i class="fas fa-check"></i> 确认开单</button>
  </div>

  <!-- 收据弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="receipt" id="receipt"></div>
      <div class="modal-btns">
        <button class="b-wa"    id="b-wa"><i class="fab fa-whatsapp"></i> 发客户</button>
        <button class="b-img"   id="b-img"><i class="fas fa-image"></i> 存图</button>
        <button class="b-close" id="b-close">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/kaidan.js"></script>
</body>
</html>
